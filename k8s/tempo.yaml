apiVersion: v1
kind: ConfigMap
metadata:
  name: tempo-config
  namespace: default
data:
  tempo.yaml: |
    stream_over_http_enabled: true

    server:
      http_listen_port: 3200

    distributor:
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: 0.0.0.0:4317
            http:
              endpoint: 0.0.0.0:4318

    storage:
      trace:
        backend: local
        wal:
          path: /data/tempo/wal
        local:
          path: /data/tempo/blocks

    usage_report:
      reporting_enabled: false

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tempo
  namespace: default
spec:
  replicas: 1

  selector:
    matchLabels:
      app: tempo

  template:
    metadata:
      labels:
        app: tempo

    spec:
      containers:
        - name: tempo
          image: grafana/tempo:3.0.3

          args:
            - -config.file=/etc/tempo/tempo.yaml

          ports:
            - name: http
              containerPort: 3200

            - name: otlp-grpc
              containerPort: 4317

            - name: otlp-http
              containerPort: 4318

          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10

          volumeMounts:
            - name: config
              mountPath: /etc/tempo
              readOnly: true

            - name: data
              mountPath: /data/tempo

            - name: runtime
              mountPath: /var/tempo

      volumes:
        - name: config
          configMap:
            name: tempo-config

        - name: data
          emptyDir: {}

        - name: runtime
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: tempo
  namespace: default
spec:
  type: ClusterIP

  selector:
    app: tempo

  ports:
    - name: http
      port: 3200
      targetPort: http

    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc

    - name: otlp-http
      port: 4318
      targetPort: otlp-http
