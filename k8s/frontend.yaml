apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/emreeaarslan/cicd-frontend:v1.0.2
          ports:
            - containerPort: 5002
          env:
            - name: BACKEND_URL
              value: http://backend:5001

          startupProbe:
            httpGet:
              path: /health
              port: 5002
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 15

          readinessProbe:
            httpGet:
              path: /health
              port: 5002
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health
              port: 5002
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - port: 5002
      targetPort: 5002