apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-helm-notifications
  namespace: default
  labels:
    grafana_alert: "1"
data:
  contact-points.yaml: |
    apiVersion: 1

    contactPoints:
      - orgId: 1
        name: mailpit-email
        receivers:
          - uid: mailpit_email
            type: email
            disableResolveMessage: false
            settings:
              addresses: alerts@cicd.local
              singleEmail: true

  notification-policies.yaml: |
    apiVersion: 1

    policies:
      - orgId: 1
        receiver: mailpit-email
        group_by:
          - grafana_folder
          - alertname
        group_wait: 0s
        group_interval: 1m
        repeat_interval: 4h
