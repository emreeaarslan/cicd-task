apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-helm-datasource
  namespace: default
  labels:
    grafana_datasource: "1"
data:
  prometheus.yaml: |
    apiVersion: 1

    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        editable: false
