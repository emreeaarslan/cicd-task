apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailpit
  namespace: default
spec:
  replicas: 1

  selector:
    matchLabels:
      app: mailpit

  template:
    metadata:
      labels:
        app: mailpit

    spec:
      containers:
        - name: mailpit
          image: axllent/mailpit:v1.31.1

          ports:
            - name: http
              containerPort: 8025

            - name: smtp
              containerPort: 1025

          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5

          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: mailpit
  namespace: default
spec:
  selector:
    app: mailpit

  ports:
    - name: http
      port: 8025
      targetPort: http

    - name: smtp
      port: 1025
      targetPort: smtp

  type: ClusterIP
