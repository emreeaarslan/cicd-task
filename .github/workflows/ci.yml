name: CI

on:
  push:
    branches:
      - main
      - dev
      - "feature/**"
    tags:
      - "v*.*.*"

  pull_request:
    branches:
      - main
      - dev

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/cicd-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/cicd-frontend

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install backend dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run backend tests
        run: python -m pytest -v

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install frontend dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run frontend tests
        run: python -m pytest -v

  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest

    needs:
      - backend-tests
      - frontend-tests

    if: github.event_name == 'pull_request' || github.ref_type == 'branch'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend image
        uses: docker/build-push-action@v7
        with:
          context: ./backend-service
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/dev' }}
          tags: ${{ env.BACKEND_IMAGE }}:dev-${{ github.sha }}

      - name: Build frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend-service
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/dev' }}
          tags: ${{ env.FRONTEND_IMAGE }}:dev-${{ github.sha }}

  release:
    name: Release
    runs-on: ubuntu-latest

    needs:
      - backend-tests
      - frontend-tests

    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')

    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend release image
        uses: docker/build-push-action@v7
        with:
          context: ./backend-service
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.BACKEND_IMAGE }}:${{ github.ref_name }}

      - name: Build and push frontend release image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend-service
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.FRONTEND_IMAGE }}:${{ github.ref_name }}

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes